name: build-windows-msvc

# Source build of the patched Codex CLI (native DeepSeek subagent support) for
# Windows x64 MSVC, packaged as a shareable zip bundle.
#
# Manual dispatch only. This workflow does not run on push or pull request, it
# never publishes a release, and it only reads this repository. The build inputs
# are pinned in build/pins.json and in the download manifest under verification/.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Cargo profile: dev-small is the cheap default, release uses thin LTO and is much slower"
        type: choice
        default: dev-small
        options:
          - dev-small
          - dev
          - release
      run_tests:
        description: "Run the focused codex-core role tests with cargo-nextest"
        type: boolean
        default: true
      run_integration_tests:
        description: "Also run the multi-agent integration tests (slow, opt-in)"
        type: boolean
        default: false
      work_root:
        description: "Build root on the runner; it needs roughly 45 GiB of free space"
        type: string
        default: 'C:\build'
      retention_days:
        description: "How long to keep the uploaded artifact, in days"
        type: number
        default: 7

permissions:
  contents: read

concurrency:
  group: build-windows-msvc-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "0"

jobs:
  build:
    name: Windows x64 MSVC source build
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Enable git long paths
        shell: pwsh
        run: |
          # This runs before checkout on purpose. The upstream codex-rs tree has
          # deeply nested paths that fail to check out on Windows without long
          # path support, so the runner's git configuration is relaxed first.
          git config --global core.longpaths true
          git config --global --get core.longpaths

      - name: Check out this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Show runner facts
        shell: pwsh
        run: |
          Write-Host "Runner   : $env:RUNNER_NAME ($env:RUNNER_OS $env:RUNNER_ARCH)"
          Write-Host "Image    : $env:ImageOS"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "git      : $(& git --version)"
          $rustup = Get-Command rustup -ErrorAction SilentlyContinue
          Write-Host "rustup   : $($rustup.Source)"
          Write-Host "Disk:"
          Get-PSDrive -PSProvider FileSystem |
            Where-Object { $_.Free -ne $null } |
            Format-Table -AutoSize Name,
              @{ Name = 'SizeGiB'; Expression = { [math]::Round(($_.Used + $_.Free) / 1GB, 1) } },
              @{ Name = 'FreeGiB'; Expression = { [math]::Round($_.Free / 1GB, 1) } }

      - name: Validate pinned inputs and scripts
        shell: pwsh
        run: |
          & pwsh -NoProfile -NonInteractive -File "$env:GITHUB_WORKSPACE/build/tests/Test-BuildScripts.ps1"
          exit $LASTEXITCODE

      - name: Build and package the bundle
        id: build
        shell: pwsh
        env:
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_RUN_TESTS: ${{ inputs.run_tests }}
          INPUT_RUN_INTEGRATION_TESTS: ${{ inputs.run_integration_tests }}
          INPUT_WORK_ROOT: ${{ inputs.work_root }}
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'build/Build-NativeRuntime.ps1'
          $scriptArgs = @(
            '-NoProfile',
            '-NonInteractive',
            '-File', $script,
            '-WorkRoot', $env:INPUT_WORK_ROOT,
            '-Profile', $env:INPUT_PROFILE
          )
          if ($env:INPUT_RUN_TESTS -ne 'true') { $scriptArgs += '-SkipTests' }
          if ($env:INPUT_RUN_INTEGRATION_TESTS -eq 'true') { $scriptArgs += '-IncludeIntegrationTests' }
          Write-Host "Running: pwsh $($scriptArgs -join ' ')"
          & pwsh @scriptArgs
          exit $LASTEXITCODE

      - name: Upload the bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.build.outputs.bundle_name }}
          path: ${{ steps.build.outputs.bundle_zip }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
          compression-level: 0
